[project]
name = "jobintel"
version = "0.1.0"
description = "Personal Job Intelligence & Resume Tailoring platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "supabase>=2.10",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
jobintel = "jobintel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/jobintel"]

[tool.hatch.build.targets.wheel.force-include]
"backend/jobintel/collectors/boards.yaml" = "jobintel/collectors/boards.yaml"

[tool.vercel]
entrypoint = "backend.jobintel.api.app:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build && rm -rf public && mkdir -p public && cp -R frontend/dist/. public/"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
